name: Deploy Plan Tracker & Guitar Coach

on:
  push:
    branches: [main]
    paths: ['app/**', 'guitar/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            guitar/package-lock.json
      - run: npm ci && npm run build
        working-directory: app
      - run: npm ci && npm run build
        working-directory: guitar
      - run: cp -r guitar/dist app/dist/guitar
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
